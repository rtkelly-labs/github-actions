name: Action smoke
on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR to exercise trusted-main sticky publication against
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: scope-smoke-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: gather
        uses: ./pr-context
      - id: present
        uses: ./pr-assessment
        with:
          context-file: ${{ steps.gather.outputs.context-file }}
      - name: Verify advisory outputs without write access
        shell: python
        env:
          GATHER_CODE: ${{ steps.gather.outputs.error-code }}
          ASSESSMENT_CODE: ${{ steps.present.outputs.error-code }}
          SIZE: ${{ steps.present.outputs.size }}
        run: |
          import os
          assert os.environ['GATHER_CODE'] == '0'
          assert os.environ['ASSESSMENT_CODE'] == '2', 'No BYOA judgment should be inferred'
          assert os.environ['SIZE'] in {'XS', 'S', 'M', 'L', 'XL', 'XXL'}
  trusted-publication:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: gather
        uses: ./pr-context
        with:
          pr-number: ${{ inputs.pr-number }}
      - id: present
        uses: ./pr-assessment
        with:
          context-file: ${{ steps.gather.outputs.context-file }}
      - id: sticky
        uses: ./sticky-comment
        with:
          pr-number: ${{ inputs.pr-number }}
          session: pr-scope-assessment
          context-file: ${{ steps.gather.outputs.context-file }}
          markdown-file: ${{ steps.present.outputs.markdown-file }}
          error-code: ${{ steps.present.outputs.error-code }}
      - name: Verify publication preserves the advisory code
        shell: python
        env:
          GATHER_CODE: ${{ steps.gather.outputs.error-code }}
          ASSESSMENT_CODE: ${{ steps.present.outputs.error-code }}
          PUBLICATION_CODE: ${{ steps.sticky.outputs.error-code }}
        run: |
          import os
          assert os.environ['GATHER_CODE'] == '0'
          assert os.environ['ASSESSMENT_CODE'] == '2'
          assert os.environ['PUBLICATION_CODE'] == '2'
