name: Release draft
description: Draft a GitHub release at a commit without creating its tag, backing out if another release for the tag appears
inputs:
  token:
    description: Token that can read and write releases (contents write; drafts are listed only with push access)
    default: ${{ github.token }}
  repository:
    description: Target owner/repository
    default: ${{ github.repository }}
  tag:
    description: Release tag, <package>/v<version>
    required: true
  sha:
    description: Full 40-character commit the release (and later its tag) points at
    required: true
  title:
    description: Release title
    required: true
  notes:
    description: Release notes (Markdown)
    default: ''
  prerelease:
    description: Whether the release is a prerelease
    default: 'false'
outputs:
  release-id:
    description: Id of the created draft
    value: ${{ steps.run.outputs.release-id }}
runs:
  using: composite
  steps:
    # Runs a prebuilt Native AOT binary (see README "Release actions"); inputs reach it only through env.
    - id: run
      shell: bash
      env:
        ESTATE_ACTIONS_PATH: ${{ github.action_path }}
        ESTATE_ACTIONS_COMMAND: release-draft
        GITHUB_TOKEN: ${{ inputs.token }}
        RELEASE_REPOSITORY: ${{ inputs.repository }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_SHA: ${{ inputs.sha }}
        RELEASE_TITLE: ${{ inputs.title }}
        RELEASE_NOTES: ${{ inputs.notes }}
        RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail
        fail() { echo "::error::$1"; exit 1; }
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset=estate-actions-linux-x64 ;;
          Linux/ARM64) asset=estate-actions-linux-arm64 ;;
          macOS/ARM64) asset=estate-actions-osx-arm64 ;;
          Windows/X64) asset=estate-actions-win-x64.exe ;;
          *) fail "estate-actions has no binary for $RUNNER_OS/$RUNNER_ARCH." ;;
        esac
        # The checksums come from this action's own ref, never from the download.
        sums="$ESTATE_ACTIONS_PATH/../dist/checksums.txt"
        [ -f "$sums" ] || fail "dist/checksums.txt is missing at this ref."
        repository=$(sed -n 's/^# repository: //p' "$sums" | tr -d '\r')
        release=$(sed -n 's/^# release: //p' "$sums" | tr -d '\r')
        expected=$(awk -v a="$asset" '$2 == a || $2 == "*" a { print $1 }' "$sums")
        [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || fail "dist/checksums.txt has no $asset at this ref; pin a commit that carries released binaries."
        # Hash stdin: sha256sum escapes its output when a path holds a backslash (Windows tool cache).
        sha256() { if command -v sha256sum >/dev/null; then sha256sum; else shasum -a 256; fi < "$1" | cut -d ' ' -f 1; }
        dir="$RUNNER_TOOL_CACHE/estate-actions/$expected"
        bin="$dir/$asset"
        if [ ! -f "$bin" ] || [ "$(sha256 "$bin")" != "$expected" ]; then
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail "dist/checksums.txt names no repository."
          [[ "$release" =~ ^[A-Za-z0-9_.-]+$ ]] || fail "dist/checksums.txt names no release."
          tmp=$(mktemp -d "${RUNNER_TEMP:-/tmp}/estate-actions.XXXXXX")
          curl -fsSL --proto '=https' --retry 3 -o "$tmp/$asset" \
            "https://github.com/$repository/releases/download/$release/$asset"
          [ "$(sha256 "$tmp/$asset")" = "$expected" ] || fail "$asset from $release doesn't match dist/checksums.txt."
          chmod +x "$tmp/$asset"
          mkdir -p "$dir"
          mv -f "$tmp/$asset" "$bin"
          rm -rf "$tmp"
        fi
        exec "$bin" "$ESTATE_ACTIONS_COMMAND"
