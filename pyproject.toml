[project]
name = "estate-github-actions"
version = "0.1.0"
description = "Pure Python PR assessments and sticky GitHub reports"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11",
    "mypy>=1.15",
    "hypothesis>=6.170.13",
    "pytest-bdd>=9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

