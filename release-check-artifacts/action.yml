name: Release check artifacts
description: Check that built packages are exactly the planned ones and record the release commit
inputs:
  plan:
    description: JSON release plan (list of entries with key, package_id and version)
    required: true
  sha:
    description: Full commit every package must record as its repository commit
    required: true
  artifacts:
    description: Directory holding <key>/<id>.<version>.nupkg and .snupkg
    default: artifacts
runs:
  using: composite
  steps:
    # Runs estate-actions from bin/ at this commit; inputs reach it only through env.
    - id: run
      shell: bash
      env:
        ESTATE_ACTIONS_PATH: ${{ github.action_path }}
        ESTATE_ACTIONS_COMMAND: release-check-artifacts
        RELEASE_PLAN: ${{ inputs.plan }}
        RELEASE_SHA: ${{ inputs.sha }}
        RELEASE_ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        set -euo pipefail
        command -v dotnet >/dev/null || { echo "::error::estate-actions needs a .NET 8 or later runtime on the runner (actions/setup-dotnet)."; exit 1; }
        # The pinned commit fixes these bytes: nothing is downloaded or hashed at run time.
        exec dotnet "$ESTATE_ACTIONS_PATH/../bin/estate-actions.dll" "$ESTATE_ACTIONS_COMMAND"
